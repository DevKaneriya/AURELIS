<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4400;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f3ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" fill="#0a0a0a"/>
  
  <!-- Outer circle -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.8"/>
  
  <!-- Inner circle -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#grad1)" stroke-width="1" opacity="0.5"/>
  
  <!-- A letter (Aurelis) -->
  <text x="50" y="60" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#grad1)" text-anchor="middle" dominant-baseline="middle">A</text>
  
  <!-- Accent dot -->
  <circle cx="75" cy="30" r="3" fill="#ff4400" opacity="0.8"/>
  <circle cx="25" cy="70" r="2" fill="#00f3ff" opacity="0.8"/>
</svg>
